apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backupschedules.eevee.bot
spec:
  group: eevee.bot
  names:
    kind: BackupSchedule
    plural: backupschedules
    singular: backupschedule
    shortNames:
      - backupschedule
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Schedule
          type: string
          jsonPath: .spec.schedule
        - name: S3Store
          type: string
          jsonPath: .spec.s3Store.name
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
          description: Whether the BackupSchedule is ready
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              description: BackupScheduleSpec defines the desired state of BackupSchedule
              properties:
                schedule:
                  type: string
                  description: >-
                    Crontab-style schedule expression (e.g. "0 2 * * *" for
                    daily at 2am).

                    Translated directly to the CronJob schedule.
                s3Store:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Name of the S3Store resource in the same namespace
                  required:
                    - name
                  description: Reference to the S3Store CR instance
                image:
                  type: string
                  description: |-
                    Container image to use for the backup job
                    (e.g. "ghcr.io/eevee/backup:latest")
                imagePullPolicy:
                  type: string
                  description: |-
                    Image pull policy for the backup job container.
                    One of "Always", "IfNotPresent", "Never".
                    Default: "IfNotPresent"
              required:
                - schedule
                - s3Store
                - image
            status:
              type: object
              description: BackupScheduleStatus defines the observed state of BackupSchedule
              properties:
                conditions:
                  type: array
                  description: Conditions describing the current state
                  items:
                    type: object
                    description: Condition contains details for one aspect of the current state of
                      this API Resource.
                    properties:
                      type:
                        type: string
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      status:
                        type: string
                        description: status of the condition, one of True, False, Unknown.
                      reason:
                        type: string
                        description: reason contains a programmatic identifier indicating the reason for
                          the condition's last transition.
                      message:
                        type: string
                        description: message is a human readable message indicating details about the
                          transition.
                      lastTransitionTime:
                        type: string
                        description: lastTransitionTime is the last time the condition transitioned from
                          one status to another.
                      observedGeneration:
                        type: number
                        description: observedGeneration represents the .metadata.generation that the
                          condition was set based upon.
                    required:
                      - type
                      - status
                      - reason
                      - message
                      - lastTransitionTime
      subresources:
        status: {}
