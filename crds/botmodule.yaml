                  description: >-
                    StartupProbe defines the startup probe configuration for the
                    module container.

                    If not set, no startup probe is configured.
                backupSchedule:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Name of the backupschedule resource in the same namespace
                  required:
                    - name
                  description: >-
                    Optional reference to a backupschedule. When set, the
                    operator will

                    configure the backup CronJob to target this module's PVC.
                bootstrapFromBackup:
                  type: object
                  properties:
                    s3Store:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Name of the s3store resource in the same namespace
                      required:
                        - name
                      description: Reference to the s3store CR instance containing the backup
                    image:
                      type: string
                      description: |-
                        Container image to use for the restore job
                        (e.g. "ghcr.io/eevee/backup:latest")
                  required:
                    - s3Store
                    - image
                  description: >-
                    When set, the operator will restore the latest backup from
                    S3 into

                    this module's PVC before starting the deployment for the
                    first time.

                    Subsequent reconciliations ignore this field (no
                    re-restore).
              required: []
            status:
              type: object
              description: BotModuleStatus defines the observed state of BotModule
              properties:
                conditions:
                  type: array
                  description: Conditions describing the current state
                  items:
                    type: object
                    description: Condition contains details for one aspect of the current state of
                      this API Resource.
                    properties:
                      type:
                        type: string
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      status:
                        type: string
                        description: status of the condition, one of True, False, Unknown.
                      reason:
                        type: string
                        description: reason contains a programmatic identifier indicating the reason for
                          the condition's last transition.
                      message:
                        type: string
                        description: message is a human readable message indicating details about the
                          transition.
                      lastTransitionTime:
                        type: string
                        description: lastTransitionTime is the last time the condition transitioned from
                          one status to another.
                      observedGeneration:
                        type: number
                        description: observedGeneration represents the .metadata.generation that the
                          condition was set based upon.
                    required:
                      - type
                      - status
                      - reason
                      - message
                      - lastTransitionTime
