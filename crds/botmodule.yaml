                            working directory for the command  is root (\'/\')
                            in the container\'s filesystem. The command is
                            simply exec\'d, it is not run inside a shell, so
                            traditional shell instructions (\'|\', etc) won\'t
                            work. To use a shell, you need to explicitly call
                            out to that shell. Exit status of 0 is treated as
                            live/healthy and non-zero is unhealthy.
                    failureThreshold:
                      type: number
                      description: Minimum consecutive failures for the probe to be considered failed
                        after having succeeded. Defaults to 3. Minimum value is
                        1.
                    grpc:
                      type: object
                      properties:
                        port:
                          type: number
                          description: Port number of the gRPC service. Number must be in the range 1 to
                            65535.
                        service:
                          type: string
                          description: Service is the name of the service to place in the gRPC
                            HealthCheckRequest (see
                            https://github.com/grpc/grpc/blob/master/doc/health-checking.md).  If
                            this is not specified, the default behavior is
                            defined by gRPC.
                      required:
                        - port
                    httpGet:
                      type: object
                      properties:
                        host:
                          type: string
                          description: Host name to connect to, defaults to the pod IP. You probably want
                            to set \"Host\" in httpHeaders instead.
                        httpHeaders:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                                description: The header field name. This will be canonicalized upon output, so
                                  case-variant names will be understood as the
                                  same header.
                              value:
                                type: string
                                description: The header field value
                            required:
                              - name
                              - value
                          description: Custom headers to set in the request. HTTP allows repeated headers.
                        path:
                          type: string
                          description: Path to access on the HTTP server.
                        port:
                          type: string
                          description: IntOrString is a type that can hold an int32 or a string.  When
                            used in JSON or YAML marshalling and unmarshalling,
                            it produces or consumes the inner type.  This allows
                            you to have, for example, a JSON field that can
                            accept a name or number.
                        scheme:
                          type: string
                          description: Scheme to use for connecting to the host. Defaults to HTTP.
                      required:
                        - port
                    initialDelaySeconds:
                      type: number
                      description: "Number of seconds after the container has started before liveness
                        probes are initiated. More info:
                        https://kubernetes.io/docs/concepts/workloads/pods/pod-\
                        lifecycle#container-probes"
                    periodSeconds:
                      type: number
                      description: How often (in seconds) to perform the probe. Default to 10 seconds.
                        Minimum value is 1.
                    successThreshold:
                      type: number
                      description: Minimum consecutive successes for the probe to be considered
                        successful after having failed. Defaults to 1. Must be 1
                        for liveness and startup. Minimum value is 1.
                    tcpSocket:
                      type: object
                      properties:
                        host:
                          type: string
                          description: "Optional: Host name to connect to, defaults to the pod IP."
                        port:
                          type: string
                          description: IntOrString is a type that can hold an int32 or a string.  When
                            used in JSON or YAML marshalling and unmarshalling,
                            it produces or consumes the inner type.  This allows
                            you to have, for example, a JSON field that can
                            accept a name or number.
                      required:
                        - port
                    terminationGracePeriodSeconds:
                      type: number
                      description: Optional duration in seconds the pod needs to terminate gracefully
                        upon probe failure. The grace period is the duration in
                        seconds after the processes running in the pod are sent
                        a termination signal and the time when the processes are
                        forcibly halted with a kill signal. Set this value
                        longer than the expected cleanup time for your process.
                        If this value is nil, the pod\'s
                        terminationGracePeriodSeconds will be used. Otherwise,
                        this value overrides the value provided by the pod spec.
                        Value must be non-negative integer. The value zero
                        indicates stop immediately via the kill signal (no
                        opportunity to shut down). This is a beta field and
                        requires enabling ProbeTerminationGracePeriod feature
                        gate. Minimum value is 1.
                        spec.terminationGracePeriodSeconds is used if unset.
                    timeoutSeconds:
                      type: number
                      description: "Number of seconds after which the probe times out. Defaults to 1
                        second. Minimum value is 1. More info:
                        https://kubernetes.io/docs/concepts/workloads/pods/pod-\
                        lifecycle#container-probes"
                  description: >-
