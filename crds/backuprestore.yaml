apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backuprestores.eevee.bot
spec:
  group: eevee.bot
  names:
    kind: backuprestore
    plural: backuprestores
    singular: backuprestore
    shortNames:
      - backuprestore
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              description: backuprestoreSpec defines the desired state of backuprestore
              properties:
                botModule:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Name of the botmodule resource in the same namespace
                  required:
                    - name
                  description: Reference to the botmodule whose PVC will be restored
                s3Store:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Name of the s3store resource in the same namespace
                  required:
                    - name
                  description: Reference to the s3store CR instance containing the backup
                image:
                  type: string
                  description: |-
                    Container image to use for the restore job
                    (e.g. "ghcr.io/eevee/backup:latest")
                backupId:
                  type: string
                  description: >-
                    UUID of the specific backup to restore.

                    If omitted, the operator restores the latest backup for this
                    module

                    (determined by listing objects and selecting the most recent
                    by S3 LastModified).
                cleanRestore:
                  type: boolean
                  description: >-
                    If true, the restore script will delete all existing data in
                    the PVC

                    before extracting the backup archive. This ensures a clean
                    restore

                    with no leftover files from a previous state.

                    Default: false
              required:
                - botModule
                - s3Store
                - image
            status:
              type: object
              description: backuprestoreStatus defines the observed state of backuprestore
              properties:
                conditions:
                  type: array
                  description: Conditions describing the current state
                  items:
                    type: object
                    description: Condition contains details for one aspect of the current state of
                      this API Resource.
                    properties:
                      type:
                        type: string
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      status:
                        type: string
                        description: status of the condition, one of True, False, Unknown.
                      reason:
                        type: string
                        description: reason contains a programmatic identifier indicating the reason for
                          the condition's last transition.
                      message:
                        type: string
                        description: message is a human readable message indicating details about the
                          transition.
                      lastTransitionTime:
                        type: string
                        description: lastTransitionTime is the last time the condition transitioned from
                          one status to another.
                      observedGeneration:
                        type: number
                        description: observedGeneration represents the .metadata.generation that the
                          condition was set based upon.
                    required:
                      - type
                      - status
                      - reason
                      - message
                      - lastTransitionTime
      subresources:
        status: {}
