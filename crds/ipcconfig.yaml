apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ipcconfigs.eevee.bot
spec:
  group: eevee.bot
  names:
    kind: IpcConfig
    plural: ipcconfigs
    singular: ipcconfig
    shortNames:
      - ipcconfig
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              description: IpcConfigSpec defines the desired state of IpcConfig
              properties:
                nats:
                  type: object
                  properties:
                    managed:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          description: Should the eevee-operator deploy a NATS server for us?
                        image:
                          type: string
                          description: NATS container image to use
                        imagePullPolicy:
                          type: string
                          description: |-
                            Image pull policy for the NATS container.
                            One of "Always", "IfNotPresent", "Never".
                            Default: "IfNotPresent"
                        resources:
                          type: object
                          properties:
                            claims:
                              type: array
                              items:
                                type: object
                                properties:
                                  name:
                                    type: string
                                    description: Name must match the name of one entry in pod.spec.resourceClaims of
                                      the Pod where this field is used. It makes
                                      that resource available inside a
                                      container.
                                  request:
                                    type: string
                                    description: Request is the name chosen for a request in the referenced claim.
                                      If empty, everything from the claim is
                                      made available, otherwise only the result
                                      of this request.
                                required:
                                  - name
                              description: Claims lists the names of resources, defined in
                                spec.resourceClaims, that are used by this
                                container.  This field depends on the
                                DynamicResourceAllocation feature gate.  This
                                field is immutable. It can only be set for
                                containers.
                            limits:
                              type: object
                              properties: {}
                              description: "Limits describes the maximum amount of compute resources allowed.
                                More info:
                                https://kubernetes.io/docs/concepts/configurati\
                                on/manage-resources-containers/"
                            requests:
                              type: object
                              properties: {}
                              description: "Requests describes the minimum amount of compute resources
                                required. If Requests is omitted for a
                                container, it defaults to Limits if that is
                                explicitly specified, otherwise to an
                                implementation-defined value. Requests cannot
                                exceed Limits. More info:
                                https://kubernetes.io/docs/concepts/configurati\
                                on/manage-resources-containers/"
                          description: >-
                            Resource requirements for the NATS container.

                            If not set, no resource requests or limits are
                            applied.
                      required:
                        - enabled
                      description: Managed NATS deployment configuration
                    token:
                      type: object
                      properties:
                        generate:
                          type: boolean
                          description: Should the eevee-operator generate a token for NATS auth?
                        secretKeyRef:
                          type: object
                          properties:
                            secret:
                              type: object
                              properties:
                                name:
                                  type: string
                                  description: name is unique within a namespace to reference a secret resource.
                                namespace:
                                  type: string
                                  description: namespace defines the space within which the secret name must be
                                    unique.
                            key:
                              type: string
                          required:
                            - secret
                            - key
                          description: Where to access the NATS auth token
                      required:
                        - generate
                      description: NATS token authentication configuration
                  description: NATS configuration
              required: []
            status:
              type: object
              description: IpcConfigStatus defines the observed state of IpcConfig
              properties:
                conditions:
                  type: array
                  description: Conditions describing the current state
                  items:
                    type: object
                    description: Condition contains details for one aspect of the current state of
                      this API Resource.
                    properties:
                      type:
                        type: string
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      status:
                        type: string
                        description: status of the condition, one of True, False, Unknown.
                      reason:
                        type: string
                        description: reason contains a programmatic identifier indicating the reason for
                          the condition's last transition.
                      message:
                        type: string
                        description: message is a human readable message indicating details about the
                          transition.
                      lastTransitionTime:
                        type: string
                        description: lastTransitionTime is the last time the condition transitioned from
                          one status to another.
                      observedGeneration:
                        type: number
                        description: observedGeneration represents the .metadata.generation that the
                          condition was set based upon.
                    required:
                      - type
                      - status
                      - reason
                      - message
                      - lastTransitionTime
      subresources:
        status: {}
