apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: s3stores.eevee.bot
spec:
  group: eevee.bot
  names:
    kind: S3Store
    plural: s3stores
    singular: s3store
    shortNames:
      - S3Store
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Endpoint
          type: string
          jsonPath: .spec.endpoint
        - name: Bucket
          type: string
          jsonPath: .spec.bucket
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
          description: Whether the S3Store is ready
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              description: S3StoreSpec defines the desired state of S3Store
              properties:
                endpoint:
                  type: string
                  description: >-
                    S3-compatible endpoint URL

                    (e.g. "https://s3.amazonaws.com" or
                    "https://minio.example.com")
                accessId:
                  type: object
                  properties:
                    secretKeyRef:
                      type: object
                      properties:
                        secret:
                          type: object
                          properties:
                            name:
                              type: string
                              description: name is unique within a namespace to reference a secret resource.
                            namespace:
                              type: string
                              description: namespace defines the space within which the secret name must be
                                unique.
                        key:
                          type: string
                      required:
                        - secret
                        - key
                      description: Reference to a K8s Secret containing the credential value
                  required:
                    - secretKeyRef
                  description: Reference to a Secret containing the S3 access key ID
                accessKey:
                  type: object
                  properties:
                    secretKeyRef:
                      type: object
                      properties:
                        secret:
                          type: object
                          properties:
                            name:
                              type: string
                              description: name is unique within a namespace to reference a secret resource.
                            namespace:
                              type: string
                              description: namespace defines the space within which the secret name must be
                                unique.
                        key:
                          type: string
                      required:
                        - secret
                        - key
                      description: Reference to a K8s Secret containing the credential value
                  required:
                    - secretKeyRef
                  description: Reference to a Secret containing the S3 secret access key
                bucket:
                  type: string
                  description: S3 bucket name
                prefix:
                  type: string
                  description: |-
                    Common file prefix within the bucket for all objects
                    managed by this store (e.g. "eevee/backups/")
                region:
                  type: string
                  description: |-
                    S3 region. For AWS, this should match the bucket region.
                    For S3-compatible stores (MinIO, Garage, etc.) the region
                    may not matter — `us-east-1` is used as a default.
                    Default: "us-east-1"
                pathStyle:
                  type: boolean
                  description: |-
                    Use path-style addressing (host_base/bucket) instead of
                    virtual-hosted-style (bucket.host_base). Required for MinIO
                    and many S3-compatible stores.
                    Default: false
              required:
                - endpoint
                - accessId
                - accessKey
                - bucket
            status:
              type: object
              description: S3StoreStatus defines the observed state of S3Store
              properties:
                conditions:
                  type: array
                  description: Conditions describing the current state
                  items:
                    type: object
                    description: Condition contains details for one aspect of the current state of
                      this API Resource.
                    properties:
                      type:
                        type: string
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      status:
                        type: string
                        description: status of the condition, one of True, False, Unknown.
                      reason:
                        type: string
                        description: reason contains a programmatic identifier indicating the reason for
                          the condition's last transition.
                      message:
                        type: string
                        description: message is a human readable message indicating details about the
                          transition.
                      lastTransitionTime:
                        type: string
                        description: lastTransitionTime is the last time the condition transitioned from
                          one status to another.
                      observedGeneration:
                        type: number
                        description: observedGeneration represents the .metadata.generation that the
                          condition was set based upon.
                    required:
                      - type
                      - status
                      - reason
                      - message
                      - lastTransitionTime
      subresources:
        status: {}
